# Archive the native iOS shell and upload the IPA to TestFlight.
# Requires repository secrets (names must match exactly):
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY
#   APP_STORE_CONNECT_TEAM_ID
#
# Never print secret values. The .p8 key is written only under $RUNNER_TEMP.

name: iOS TestFlight

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_PATH: ios/OneDayInKyiv.xcodeproj
      SCHEME: OneDayInKyiv
      BUNDLE_ID: com.mikerudine.onedayinkyiv
      ASC_APP_ID: "6833437365"
      MARKETING_VERSION: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            APP_STORE_CONNECT_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Add all four App Store Connect secrets, then re-run this workflow."
            exit 1
          fi
          echo "All required App Store Connect secrets are present."

      - name: Write API key to runner temp
        id: api_key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          # Keep the .p8 outside the workspace so it cannot land in build artifacts.
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # Do not echo or set -x around the key material.
          printf '%s\n' "${APP_STORE_CONNECT_API_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          # altool discovers AuthKey_<id>.p8 under these private_keys directories.
          mkdir -p "${RUNNER_TEMP}/private_keys" "${HOME}/.appstoreconnect/private_keys"
          cp "${KEY_PATH}" "${RUNNER_TEMP}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "${KEY_PATH}" "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 \
            "${RUNNER_TEMP}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "key_path=${KEY_PATH}" >> "${GITHUB_OUTPUT}"
          echo "API key file written under RUNNER_TEMP (path omitted from logs)."

      - name: Resolve next build number
        id: build_number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_PATH: ${{ steps.api_key.outputs.key_path }}
          FALLBACK_BUILD: ${{ github.run_number }}
          FALLBACK_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          FALLBACK_BUILD_NUMBER=$(( FALLBACK_BUILD * 10 + FALLBACK_ATTEMPT ))
          BUILD_NUMBER="${FALLBACK_BUILD_NUMBER}"
          VENV_DIR="${RUNNER_TEMP}/asc-venv"
          SCRIPT_PATH="${RUNNER_TEMP}/next_build_number.py"
          RESOLVED_PATH="${RUNNER_TEMP}/resolved_build_number.txt"

          cat > "${SCRIPT_PATH}" <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"]
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          key_path = os.environ["KEY_PATH"]
          app_id = os.environ["ASC_APP_ID"]
          marketing = os.environ["MARKETING_VERSION"]
          fallback = int(os.environ["FALLBACK_BUILD"]) * 10 + int(os.environ["FALLBACK_ATTEMPT"])

          with open(key_path, "r", encoding="utf-8") as handle:
              private_key = handle.read()

          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 20 * 60,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"alg": "ES256", "kid": key_id, "typ": "JWT"},
          )
          if isinstance(token, bytes):
              token = token.decode("ascii")


          def fetch(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)


          latest = None
          query = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[preReleaseVersion.version]": marketing,
                  "sort": "-version",
                  "limit": "1",
                  "fields[builds]": "version",
              }
          )
          try:
              payload = fetch(f"https://api.appstoreconnect.apple.com/v1/builds?{query}")
              data = payload.get("data") or []
              if data:
                  latest = data[0]["attributes"]["version"]
          except urllib.error.HTTPError as exc:
              sys.stderr.write(
                  f"Filtered build lookup returned HTTP {exc.code}; trying unfiltered latest.\n"
              )
              query = urllib.parse.urlencode(
                  {
                      "filter[app]": app_id,
                      "sort": "-uploadedDate",
                      "limit": "1",
                      "fields[builds]": "version",
                  }
              )
              try:
                  payload = fetch(f"https://api.appstoreconnect.apple.com/v1/builds?{query}")
                  data = payload.get("data") or []
                  if data:
                      latest = data[0]["attributes"]["version"]
              except urllib.error.HTTPError as exc2:
                  sys.stderr.write(
                      f"Unfiltered build lookup returned HTTP {exc2.code}; using fallback.\n"
                  )
                  latest = None
          except Exception as exc:  # noqa: BLE001 — always emit a build number
              sys.stderr.write(f"Build lookup failed ({exc!r}); using fallback.\n")
              latest = None

          if latest is None:
              print(fallback)
              sys.stderr.write(
                  f"No TestFlight builds found; using fallback build number {fallback}.\n"
              )
          else:
              try:
                  nxt = int(str(latest).strip()) + 1
              except ValueError:
                  nxt = fallback
                  sys.stderr.write(
                      f"Latest build version {latest!r} is non-numeric; using fallback {fallback}.\n"
                  )
              print(nxt)
              sys.stderr.write(
                  f"Next build number: {nxt} (previous TestFlight build {latest}).\n"
              )
          PY

          # venv/pip/API lookup failures must not fail the job — fall back instead.
          set +e
          (
            set -euo pipefail
            python3 -m venv "${VENV_DIR}"
            # Install into the venv only (avoids PEP 668 externally-managed-environment).
            "${VENV_DIR}/bin/python" -m pip install --quiet "PyJWT[crypto]"
            "${VENV_DIR}/bin/python" "${SCRIPT_PATH}" > "${RESOLVED_PATH}"
          )
          lookup_status=$?
          set -euo pipefail

          if [ "${lookup_status}" -eq 0 ] && [ -s "${RESOLVED_PATH}" ]; then
            BUILD_NUMBER="$(tr -d '[:space:]' < "${RESOLVED_PATH}")"
            if [ -z "${BUILD_NUMBER}" ]; then
              BUILD_NUMBER="${FALLBACK_BUILD_NUMBER}"
              echo "::warning::Empty ASC build number; using fallback ${FALLBACK_BUILD_NUMBER}."
            fi
          else
            BUILD_NUMBER="${FALLBACK_BUILD_NUMBER}"
            echo "::warning::App Store Connect build lookup failed (exit ${lookup_status}); using fallback ${FALLBACK_BUILD_NUMBER}."
          fi

          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "Using CFBundleVersion / CURRENT_PROJECT_VERSION=${BUILD_NUMBER}"

      - name: Write ExportOptions.plist
        env:
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="${RUNNER_TEMP}/ExportOptions.plist"
          # TEAM_ID is substituted by the shell; do not print the file.
          cat > "${EXPORT_OPTIONS}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>destination</key>
          	<string>export</string>
          	<key>teamID</key>
          	<string>${APP_STORE_CONNECT_TEAM_ID}</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          </dict>
          </plist>
          EOF
          echo "export_options=${EXPORT_OPTIONS}" >> "${GITHUB_ENV}"
          echo "Wrote ExportOptions.plist under RUNNER_TEMP"

      - name: Archive Release build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          KEY_PATH: ${{ steps.api_key.outputs.key_path }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${RUNNER_TEMP}/OneDayInKyiv.xcarchive"
          echo "archive_path=${ARCHIVE_PATH}" >> "${GITHUB_ENV}"
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${APP_STORE_CONNECT_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            archive

      - name: Export App Store IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_PATH: ${{ steps.api_key.outputs.key_path }}
        run: |
          set -euo pipefail
          EXPORT_PATH="${RUNNER_TEMP}/ipa-export"
          mkdir -p "${EXPORT_PATH}"
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          IPA_PATH="$(find "${EXPORT_PATH}" -name '*.ipa' -type f -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "::error::Export succeeded but no IPA was produced under runner temp export dir"
            exit 1
          fi
          echo "ipa_path=${IPA_PATH}" >> "${GITHUB_ENV}"
          echo "Exported IPA under RUNNER_TEMP."

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          # Upload only — does not submit for App Store review and does not
          # notify external testers. Skipping the wait for processing is fine.
          xcrun altool \
            --upload-package "${IPA_PATH}" \
            --type ios \
            --apple-id "${ASC_APP_ID}" \
            --bundle-id "${BUNDLE_ID}" \
            --bundle-version "${BUILD_NUMBER}" \
            --bundle-short-version-string "${MARKETING_VERSION}" \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          echo "Upload to App Store Connect / TestFlight finished."

      - name: Scrub API key from runner temp
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_PATH: ${{ steps.api_key.outputs.key_path }}
        run: |
          set +e
          rm -f \
            "${KEY_PATH}" \
            "${RUNNER_TEMP}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            "${RUNNER_TEMP}/next_build_number.py" \
            "${RUNNER_TEMP}/resolved_build_number.txt"
          rm -rf "${RUNNER_TEMP}/asc-venv"
          echo "API key copies removed from runner temp (if present)."
