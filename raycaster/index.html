<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Прогулянка з собакою · One Day in Kyiv</title>
<style>
  *{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0a0a0f;color:#e8e8ef;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
  canvas#view{image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%;max-width:100vw;max-height:100vh;object-fit:contain;background:#111;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;font-size:13px;text-shadow:0 1px 2px #000}
  #hud .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #hud .title{font-weight:700;font-size:15px;letter-spacing:.02em}
  #hud .meta{opacity:.85;text-align:right}
  #hud .hint{opacity:.7;font-size:12px;max-width:70%}
  #lang{pointer-events:auto;background:#1f2937cc;border:1px solid #4b5563;color:#f9fafb;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:12px}
  #pad{position:absolute;inset:0;pointer-events:none}
  .stick,.btn{pointer-events:auto;position:absolute;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #move{width:120px;height:120px;left:18px;bottom:22px}
  #knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffff66;left:36px;top:36px;transition:none}
  #turnL,#turnR{width:64px;height:64px;bottom:40px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700}
  #turnL{right:100px}#turnR{right:24px}
  @media (min-width:900px){
    #move,#turnL,#turnR{opacity:.35}
    #move:hover,#turnL:hover,#turnR:hover{opacity:.7}
  }
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0f;z-index:5;font-size:14px;opacity:.8}
</style>
</head>
<body>
<div id="wrap">
  <div id="boot">Loading courtyard…</div>
  <canvas id="view" width="320" height="200"></canvas>
  <div id="hud">
    <div class="top">
      <div>
        <div class="title" id="tTitle">Прогулянка з собакою</div>
        <div class="hint" id="tHint">WASD / стрілки · двір хрущовки</div>
      </div>
      <div class="meta">
        <button id="lang" type="button">UA</button>
        <div id="fps">— fps</div>
        <div id="dogStat"></div>
      </div>
    </div>
  </div>
  <div id="pad">
    <div id="move" class="stick"><div id="knob"></div></div>
    <div id="turnL" class="btn">◀</div>
    <div id="turnR" class="btn">▶</div>
  </div>
</div>
<script src="raycaster.js"></script>
</body>
</html>
