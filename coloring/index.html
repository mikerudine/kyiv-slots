<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Розфарбуй тривоги · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<link rel="stylesheet" href="../shared/game-nav.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0a0e16;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
#wrap{
  position:relative;margin:0 auto;
  width:min(100vw,calc(100dvh*9/16),520px);
  height:min(100dvh,calc(100vw*16/9));
  aspect-ratio:9/16;
  display:flex;flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:#0d121c;overflow:hidden;
}
header{display:flex;align-items:center;gap:6px;flex-shrink:0}
header a.game-nav{flex:none}
h1{flex:1;margin:0;font-size:15px;color:#f8fafc;text-align:center;font-weight:800;letter-spacing:.01em}
header button{
  border:1.5px solid #64748b;background:#1a2233;color:#e2e8f0;
  font:700 11px inherit;padding:4px 8px;border-radius:4px;
}
#hud{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:6px 0 4px;flex-shrink:0;font-weight:800;
}
#timer{
  font-variant-numeric:tabular-nums;font-size:22px;line-height:1;
  color:#f8fafc;min-width:3.2em;
}
#timer.warn{color:#fbbf24}
#timer.urgent{color:#f87171}
#round{font-size:13px;color:#94a3b8}
#lives{font-size:12px;color:#94a3b8;white-space:nowrap}
#progress{font-size:13px;color:#cbd5e1}
#stage{
  position:relative;flex:1;min-height:0;border:2px solid #2a3548;border-radius:6px;
  background:#0b1020;overflow:hidden;touch-action:none;
}
#mapViewport{
  position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair;
}
#mapWorld{
  position:absolute;inset:0;touch-action:none;
}
#board{
  display:block;width:100%;height:100%;touch-action:none;
}
#changeBanner{
  position:absolute;left:50%;top:12%;transform:translateX(-50%);
  background:#111827ee;border:1.5px solid #fbbf24;color:#fde68a;
  font:800 13px inherit;padding:8px 14px;border-radius:6px;
  opacity:0;pointer-events:none;z-index:5;white-space:nowrap;
  transition:opacity .25s ease;
}
#changeBanner.show{opacity:1}
#hint{font-size:11px;color:#64748b;text-align:center;margin:4px 0 2px;flex-shrink:0;min-height:14px}
#palette{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex-shrink:0;padding:2px 0 0;
}
.swatch{
  width:52px;height:52px;border-radius:8px;border:2px solid #64748b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 2px #000a;
  box-shadow:inset 0 0 0 1px #0004;position:relative;cursor:pointer;
}
.swatch small{font-size:9px;font-weight:700;opacity:.9;line-height:1.1;text-align:center;max-width:46px}
.swatch.on{border-color:#f8fafc;box-shadow:0 0 0 2px #f8fafc55, inset 0 0 0 1px #0004}
#zoomHint{position:absolute;right:6px;bottom:6px;font-size:10px;color:#64748b;z-index:4;pointer-events:none}
.ov{
  position:absolute;inset:0;background:#0b1020e8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  text-align:center;gap:10px;z-index:10;
}
.ov.hidden{display:none}
.ov h2{margin:0;color:#f8fafc;font-size:22px}
.ov p{margin:0;font-size:14px;line-height:1.45;color:#cbd5e1;max-width:320px}
.ov button{
  border:2px solid #000;background:#fde047;color:#0b1020;
  font:900 16px inherit;padding:10px 22px;border-radius:6px;box-shadow:3px 3px 0 #000;min-height:44px;cursor:pointer;
}
.ov a.game-nav-to-menu{
  border:2px solid #000;background:#e2e8f0;color:#0b1020;
  font:900 16px inherit;padding:10px 22px;border-radius:6px;box-shadow:3px 3px 0 #000;
}
.ov .stats{font-size:15px;color:#e2e8f0;font-weight:700}
#attr{font-size:9px;color:#475569;text-align:center;margin-top:2px;flex-shrink:0;line-height:1.3}
@media (prefers-reduced-motion:reduce){
  #changeBanner{transition:none}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <a href="../menu/" id="menu" class="game-nav" data-game-nav>≡ Меню</a>
    <h1 id="title"></h1>
    <button id="lang" type="button">UA</button>
    <button id="pauseBtn" type="button">⏸</button>
  </header>
  <div id="hud">
    <span id="timer">60.0</span>
    <span id="lives"></span>
    <span id="round"></span>
    <span id="progress"></span>
  </div>
  <div id="stage">
    <div id="mapViewport">
      <div id="mapWorld">
        <canvas id="board" aria-label="map"></canvas>
      </div>
    </div>
    <div id="changeBanner" aria-live="polite"></div>
    <div id="zoomHint">2 fingers · wheel</div>
  </div>
  <div id="hint"></div>
  <div id="palette" role="listbox" aria-label="palette"></div>
  <div id="attr"></div>
  <div class="ov hidden" id="pause"><h2 id="pauseTxt"></h2></div>
  <div class="ov" id="overlay">
    <h2 id="oTitle"></h2>
    <p id="oBody"></p>
    <div class="stats" id="oStats" hidden></div>
    <a class="zsu-donate" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
    <div class="game-nav-actions">
      <button id="oBtn" type="button"></button>
      <a href="../menu/" class="game-nav-to-menu" data-game-nav-to-menu hidden>В меню</a>
    </div>
  </div>
</div>
<script src="../shared/zsu-donate.js"></script>
<script src="../shared/game-nav.js"></script>
<script src="game.js"></script>
</body>
</html>
