<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Metro · One Day in Kyiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3efe6;--ink:#1c2430;--muted:#5c6b7a;
  --red:#d3212c;--blue:#1f5aa8;--green:#1f8a4c;--paper:#fffdf8;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif}
body{
  background:
    linear-gradient(90deg,transparent 49%,#d9d2c455 50%,transparent 51%),
    linear-gradient(#d9d2c433 1px,transparent 1px),
    linear-gradient(90deg,#d9d2c433 1px,transparent 1px),
    var(--bg);
  background-size:100% 100%,28px 28px,28px 28px,auto;
}
#wrap{
  margin:0 auto;max-width:760px;min-height:100dvh;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(22px + env(safe-area-inset-bottom,0px));
}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{margin:0;font-family:Rubik,sans-serif;font-weight:900;font-size:clamp(1.45rem,5.5vw,2.1rem);letter-spacing:-.03em}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.tools{display:flex;gap:8px}
.tools a,.tools button{
  appearance:none;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);
  font:700 12px/1 "Golos Text",sans-serif;padding:8px 12px;text-decoration:none;cursor:pointer;
}
.map{
  background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px 12px 8px;
  box-shadow:0 10px 0 #cfc6b4;
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:6px;border-radius:99px;display:inline-block}
.line{position:relative;margin:0 0 18px;padding-left:2px}
.line-title{
  display:inline-flex;align-items:center;gap:8px;font-family:Rubik,sans-serif;font-weight:900;
  font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;padding:4px 10px;
  border-radius:999px;color:#fff;
}
.line.red .line-title{background:var(--red)}
.line.blue .line-title{background:var(--blue)}
.line.green .line-title{background:var(--green)}
.track{position:relative;display:flex;flex-direction:column;gap:0;padding-left:18px}
.track::before{
  content:"";position:absolute;left:7px;top:10px;bottom:10px;width:4px;border-radius:4px;
}
.line.red .track::before{background:var(--red)}
.line.blue .track::before{background:var(--blue)}
.line.green .track::before{background:var(--green)}
a.station{
  position:relative;display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;
  text-decoration:none;color:inherit;padding:8px 8px 8px 0;border-radius:12px;
  transition:background .15s ease, transform .15s ease;
}
a.station:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:hover){a.station:hover{background:#00000008;transform:scale(1.01)}}
a.station:active{transform:scale(.99)}
a.station::before{
  content:"";position:absolute;left:-15px;top:50%;width:14px;height:14px;margin-top:-7px;
  border-radius:50%;background:#fff;border:3px solid var(--ink);z-index:1;
}
.line.red a.station::before{border-color:var(--red)}
.line.blue a.station::before{border-color:var(--blue)}
.line.green a.station::before{border-color:var(--green)}
a.station .thumb{
  width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--ink);background:#111;flex:none;
}
a.station .thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
a.station .name{font-weight:900;font-size:15px;line-height:1.2}
a.station .desc{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.35}
.arch{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:16px;text-decoration:none}
@media (min-width:640px){
  .track{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding-left:22px}
  .track::before{left:9px}
  a.station::before{left:-19px}
}
@media (prefers-reduced-motion:reduce){
  a.station,a.station:hover,a.station:active{transition:none;transform:none}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <h1 class="brand" id="brand"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <a href="../">←</a>
      <button type="button" id="lang">UA</button>
    </div>
  </header>
  <div class="map">
    <div class="legend" id="legend"></div>
    <div id="list"></div>
  </div>
  <a class="arch" id="arch" href="../../raycaster/"></a>
</div>
<script src="../games.js"></script>
<script>
const {G,T,createLang,archHref}=MenuConcepts;
/* Lines loosely themed after Kyiv metro colours */
const LINES=[
  {key:'red', ua:'Червона · побут', en:'Red · daily life', ids:['slots','laundry','dice']},
  {key:'blue', ua:'Синя · шлях додому', en:'Blue · way home', ids:['dogwalk','scooter','commute']},
  {key:'green', ua:'Зелена · блекаут', en:'Green · blackout', ids:['findit','minesweeper','tetris']},
];
const byId=Object.fromEntries(G.map(g=>[g.id,g]));
const list=document.getElementById('list');
const legend=document.getElementById('legend');
const langCtrl=createLang(render);
function render(lang){
  const L=T[lang];
  brand.textContent=L.brand;
  sub.textContent=lang==='ua'?'Ігри як станції метро':'Games as metro stations';
  arch.textContent=L.arch;
  arch.href=archHref;
  langBtn.textContent=langCtrl.label();
  legend.innerHTML=LINES.map(ln=>`<span><i style="background:var(--${ln.key})"></i>${ln[lang]}</span>`).join('');
  list.innerHTML=LINES.map(ln=>`
    <section class="line ${ln.key}">
      <h2 class="line-title">${ln[lang]}</h2>
      <div class="track">
        ${ln.ids.map(id=>{
          const g=byId[id];
          return `<a class="station" href="${g.h}">
            <div class="thumb"><img src="${g.img}" alt="" loading="lazy" width="112" height="112"></div>
            <div><div class="name">${g.e} ${g[lang][0]}</div><div class="desc">${g[lang][1]}</div></div>
          </a>`;
        }).join('')}
      </div>
    </section>`).join('');
}
const langBtn=document.getElementById('lang');
langBtn.onclick=()=>langCtrl.toggle();
langCtrl.apply();
</script>
</body>
</html>
