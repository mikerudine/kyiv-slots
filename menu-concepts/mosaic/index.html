<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Mosaic · One Day in Kyiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#071018;color:#f4f7fb;font-family:Manrope,system-ui,sans-serif}
body{
  background:
    radial-gradient(120% 70% at 50% -10%,#1a3348 0%,transparent 55%),
    linear-gradient(180deg,#0a1620 0%,#071018 45%,#050b12 100%);
}
#wrap{
  margin:0 auto;max-width:920px;min-height:100dvh;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(22px + env(safe-area-inset-bottom,0px));
}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(1.35rem,5.2vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:0;color:#f6e27a}
.sub{margin:6px 0 0;color:#9db0c4;font-size:13px;font-weight:500}
.tools{display:flex;gap:8px;flex:none}
.tools a,.tools button{
  appearance:none;border:0;border-radius:999px;text-decoration:none;cursor:pointer;
  background:#142433;color:#f6e27a;font:800 12px/1 Manrope,sans-serif;padding:9px 12px;
}
.tools a{color:#b8c9da;font-weight:700}
.mosaic{
  display:grid;gap:8px;
  grid-template-columns:1fr 1fr;
  grid-auto-rows:minmax(108px,auto);
}
@media (min-width:720px){
  .mosaic{grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(140px,auto);gap:10px}
}
a.tile{
  position:relative;display:block;overflow:hidden;border-radius:16px;
  text-decoration:none;color:#fff;min-height:108px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  transition:transform .18s ease, filter .18s ease;
}
a.tile:focus-visible{outline:2px solid #f6e27a;outline-offset:2px}
@media (hover:hover){
  a.tile:hover{transform:scale(1.015);filter:brightness(1.05)}
}
a.tile:active{transform:scale(.985)}
a.tile img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;
  display:block;
}
a.tile .scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 35%,rgba(4,10,18,.88) 100%);
}
a.tile .meta{position:absolute;left:10px;right:10px;bottom:10px;z-index:1}
a.tile .t{font-family:Unbounded,sans-serif;font-weight:600;font-size:14px;letter-spacing:-.01em}
a.tile .d{margin-top:3px;font-size:11px;line-height:1.35;color:#d5e0ea;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
a.tile.hero .t{font-size:clamp(16px,4.2vw,22px)}
a.tile.hero .d{-webkit-line-clamp:3}
/* mobile bento */
a.tile[data-id=slots]{grid-column:1/-1;min-height:200px}
a.tile[data-id=dogwalk],a.tile[data-id=scooter]{min-height:150px}
a.tile[data-id=commute]{grid-column:1/-1;min-height:140px}
@media (min-width:720px){
  a.tile[data-id=slots]{grid-column:span 4;grid-row:span 2;min-height:300px}
  a.tile[data-id=dogwalk]{grid-column:span 2;grid-row:span 2;min-height:300px}
  a.tile[data-id=scooter],a.tile[data-id=laundry]{grid-column:span 3;min-height:180px}
  a.tile[data-id=dice],a.tile[data-id=commute]{grid-column:span 3;min-height:180px}
  a.tile[data-id=findit],a.tile[data-id=minesweeper],a.tile[data-id=tetris]{grid-column:span 2;min-height:170px}
  a.tile[data-id=commute]{grid-column:span 3}
}
.arch{display:block;text-align:center;color:#6f8499;font-size:12px;margin-top:16px;text-decoration:none}
@media (prefers-reduced-motion:reduce){
  a.tile,a.tile:hover,a.tile:active{transition:none;transform:none;filter:none}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <h1 class="brand" id="brand"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <a href="../">←</a>
      <button type="button" id="lang">UA</button>
    </div>
  </header>
  <div class="mosaic" id="list"></div>
  <a class="arch" id="arch" href="../../raycaster/"></a>
</div>
<script src="../games.js"></script>
<script>
const {G,T,createLang,archHref}=MenuConcepts;
const list=document.getElementById('list');
const langCtrl=createLang(render);
function render(lang){
  const L=T[lang];
  brand.textContent=L.brand;
  sub.textContent=L.sub;
  arch.textContent=L.arch;
  arch.href=archHref;
  langBtn.textContent=langCtrl.label();
  list.innerHTML=G.map((g,i)=>`
    <a class="tile${i===0?' hero':''}" data-id="${g.id}" href="${g.h}">
      <img src="${g.img}" alt="" loading="lazy" width="780" height="844">
      <div class="scrim"></div>
      <div class="meta"><div class="t">${g.e} ${g[lang][0]}</div><div class="d">${g[lang][1]}</div></div>
    </a>`).join('');
}
const langBtn=document.getElementById('lang');
langBtn.onclick=()=>langCtrl.toggle();
langCtrl.apply();
</script>
</body>
</html>
