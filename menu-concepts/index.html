<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Menu concepts · One Day in Kyiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0a1018;color:#e8eef6;font-family:Manrope,system-ui,sans-serif}
body{background:radial-gradient(100% 60% at 50% 0%,#1a2a3d,#0a1018 60%)}
#wrap{
  margin:0 auto;max-width:640px;min-height:100dvh;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
h1{margin:0;font-family:Unbounded,sans-serif;font-size:clamp(1.5rem,5.5vw,2rem);color:#f6e27a;letter-spacing:-.02em}
.lead{margin:8px 0 18px;color:#9eafc2;font-size:14px;line-height:1.45}
.row{display:flex;gap:8px;margin-bottom:18px}
.row a,.row button{
  appearance:none;border:0;border-radius:999px;background:#172333;color:#f6e27a;
  font:800 12px/1 Manrope,sans-serif;padding:9px 13px;text-decoration:none;cursor:pointer;
}
.row a{color:#b7c6d8;font-weight:700}
a.card{
  display:block;text-decoration:none;color:inherit;background:#121c2a;border:1px solid #243246;
  border-radius:16px;padding:14px 14px 15px;margin-bottom:10px;
  transition:transform .15s ease, background .15s ease;
}
@media (hover:hover){a.card:hover{transform:scale(1.01);background:#162234}}
a.card:active{transform:scale(.99)}
a.card .k{font-family:Unbounded,sans-serif;font-size:15px;color:#f6e27a}
a.card .d{margin-top:4px;font-size:13px;color:#b7c6d8;line-height:1.4}
.note{margin-top:18px;font-size:12px;color:#6f8298;line-height:1.45}
@media (prefers-reduced-motion:reduce){
  a.card,a.card:hover,a.card:active{transition:none;transform:none}
}
</style>
</head>
<body>
<div id="wrap">
  <h1 id="h">Menu concepts</h1>
  <p class="lead" id="lead"></p>
  <div class="row">
    <a href="../menu/" id="live"></a>
    <button type="button" id="lang">UA</button>
  </div>
  <div id="list"></div>
  <p class="note" id="note"></p>
</div>
<script>
const C=[
  {h:'mosaic/', ua:['Мозаїка','Bento-сітка зі скріншотами ігор, різні розміри плиток'], en:['Mosaic','Bento grid of real game screenshots, mixed tile sizes']},
  {h:'comic/', ua:['Комікс','Сторінка коміксу з панелями, хмарками й растром'], en:['Comic','Comic-book page with panels, speech bubbles, halftone']},
  {h:'metro/', ua:['Метро','Схема метро: ігри як станції на трьох лініях'], en:['Metro','Kyiv metro map: games as stations on three lines']},
  {h:'poster/', ua:['Афіші','Вечірня вулиця з постерами-скріншотами'], en:['Poster city','Evening street of screenshot posters']},
];
const T={
  ua:{h:'Концепти меню',lead:'Обери варіант — живе /menu/ не змінювалось.',live:'← Живе меню',note:'Прототипи для порівняння. Усі ігри й UA/EN як у поточному меню.'},
  en:{h:'Menu concepts',lead:'Pick a direction — live /menu/ is unchanged.',live:'← Live menu',note:'Prototypes for comparison. Same games and UA/EN as the current menu.'}
};
let lang=localStorage.getItem('menu-lang')||'ua';
function render(){
  const L=T[lang];
  document.documentElement.lang=lang==='ua'?'uk':'en';
  h.textContent=L.h; lead.textContent=L.lead; live.textContent=L.live; note.textContent=L.note;
  langBtn.textContent=lang.toUpperCase();
  list.innerHTML=C.map(c=>`<a class="card" href="${c.h}"><div class="k">${c[lang][0]}</div><div class="d">${c[lang][1]}</div></a>`).join('');
}
const langBtn=document.getElementById('lang');
langBtn.onclick=()=>{lang=lang==='ua'?'en':'ua';localStorage.setItem('menu-lang',lang);render();};
render();
</script>
</body>
</html>
