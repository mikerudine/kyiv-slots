<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Графік світла · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:#e8ebf0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a2340}
#wrap{margin:0 auto;max-width:720px;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:#f4f5f8}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header a{color:#64748b;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;padding:6px 2px}
h1{margin:0;font-size:clamp(15px,4.2vw,18px);font-weight:800;color:#1a2340;text-align:center;flex:1;line-height:1.2}
#lang{border:0;border-radius:999px;background:#1a2340;color:#fff;font-weight:800;padding:6px 12px;font-size:12px}
#diff{display:flex;gap:6px;background:#fff;border:1px solid #d7dbe3;border-radius:999px;padding:3px}
#diff button{border:0;border-radius:999px;background:transparent;color:#475569;font-weight:800;font-size:12px;padding:8px 12px;min-height:36px;cursor:pointer}
#diff button.on{background:#ffe566;color:#1a2340;box-shadow:inset 0 0 0 1px #f5b400}
#toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{background:#fff;border:1px solid #d7dbe3;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:#1a2340;display:flex;align-items:center;gap:6px;min-height:40px}
.stat b{font-variant-numeric:tabular-nums;font-size:16px}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.actions button{border:0;border-radius:999px;font-weight:800;font-size:13px;padding:10px 14px;min-height:40px;cursor:pointer}
#flagMode{background:#fff;color:#1a2340;border:1.5px solid #c9ced8}
#flagMode.on{background:#ffe566;border-color:#f5b400;box-shadow:inset 0 0 0 1px #f5b400}
#rulesBtn,#replay{background:#1a2340;color:#fff}
#rulesBtn{background:#fff;color:#1a2340;border:1.5px solid #c9ced8}
#hint{font-size:12px;color:#64748b;line-height:1.35;min-height:16px}
#boardWrap{background:#fff;border:1px solid #d0d5de;border-radius:14px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:280px;box-shadow:0 1px 2px #0000000a}
/* Keep win/lose + donate banner on-screen: board scrolls inside, result stays pinned */
#wrap:has(#result.show){height:100dvh;max-height:100dvh;min-height:0;overflow:hidden;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#wrap:has(#result.show) #boardWrap{flex:1 1 0;min-height:120px}
#board{display:grid;border-collapse:collapse}
#board.easy{grid-template-columns:42px repeat(10,minmax(24px,1fr));width:100%;min-width:0}
#board.hard{grid-template-columns:48px repeat(30,36px);width:max-content;min-width:1128px}
.corner,.queue,.hour,.dayg{background:#f7f8fb;color:#1a2340;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid #e2e5ec;border-right:1px solid #e2e5ec;padding:4px 2px;line-height:1.15}
.corner{position:sticky;left:0;top:0;z-index:5;background:#f7f8fb;font-size:10px;font-weight:800}
#board.easy .queue{font-size:11px;font-weight:800;min-height:28px;position:sticky;top:0;z-index:3;background:#eef1f6}
#board.hard .dayg{grid-column:span 10;font-size:11px;font-weight:800;background:#eef1f6;min-height:24px;position:sticky;top:0;z-index:3}
#board.hard .queue{font-size:10px;font-weight:800;min-height:28px;position:sticky;top:24px;z-index:3;background:#f7f8fb;padding:2px 1px}
#board.hard .corner.queue-spacer{top:24px;min-height:28px;z-index:4}
.hour{position:sticky;left:0;z-index:2;font-variant-numeric:tabular-nums;min-height:36px;font-size:11px;font-weight:800;background:#f7f8fb}
.cell{min-height:36px;min-width:0;border:0;border-bottom:1px solid #d0d5de;border-right:1px solid #d0d5de;border-radius:0;background:#5c6578;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:13px;color:#1a2340;position:relative;touch-action:manipulation;padding:0;-webkit-appearance:none;appearance:none}
#board.easy .cell{min-height:34px;font-size:12px}
#board.hard .cell{min-height:36px;min-width:36px;font-size:12px}
.cell:active{filter:brightness(.96)}
/* Unopened = darker blank; revealed outage (zero/mine) = mid-gray + bolt; power = white + digit */
.cell.closed{background:#5c6578;box-shadow:inset 0 1px 0 #ffffff28,inset 0 -1px 0 #00000030}
.cell.light{background:#fff;cursor:default}
.cell.outage{background:#9aa3b2;color:#1a2340;cursor:default}
.cell.flagged{background:#4a5263;box-shadow:inset 0 0 0 2px #f5b400}
.cell.flagged .flag{color:#ffe566;filter:drop-shadow(0 1px 0 #1a2340)}
.cell .bolt{width:18px;height:18px;display:block}
#board.hard .cell .bolt{width:15px;height:15px}
.cell .flag{font-size:15px;line-height:1}
#board.ended .cell{cursor:default}
#board.ended .cell.light{background:#fff}
#board.ended .cell.outage{background:#9aa3b2}
.n1{color:#1d4ed8}.n2{color:#15803d}.n3{color:#b45309}.n4{color:#7c3aed}
.n5{color:#be123c}.n6{color:#0f766e}.n7{color:#1a2340}.n8{color:#64748b}
#legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:#475569;padding:2px 2px 0}
#legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid #c9ced8;display:inline-block}
.sw.closed{background:#5c6578}
.sw.light{background:#fff}
.sw.dark{background:#9aa3b2;display:inline-flex;align-items:center;justify-content:center}
.sw.dark svg{width:12px;height:12px}
.sw.flag{background:#4a5263;box-shadow:inset 0 0 0 1px #f5b400}
#result{display:none;flex-direction:column;align-items:stretch;gap:8px;background:#fff;border:1px solid #d7dbe3;border-radius:12px;padding:10px 12px;flex:none}
#result.show{display:flex}
#result.win{border-color:#86efac;background:#f0fdf4}
#result.lose{border-color:#fca5a5;background:#fef2f2}
#resultMain{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#resultTxt{font-size:14px;font-weight:800;flex:1;line-height:1.3}
#result.win #resultTxt{color:#15803d}
#result.lose #resultTxt{color:#b91c1c}
#resultReplay{border:0;border-radius:999px;background:#1a2340;color:#fff;font-weight:800;font-size:13px;padding:10px 16px;min-height:40px;cursor:pointer}
#status{display:none}
.ov{position:fixed;inset:0;background:#1a2340cc;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:20}
.ov.hidden{display:none}
.panel{background:#fff;border-radius:16px;padding:20px 18px;max-width:360px;width:100%;box-shadow:0 12px 40px #0004;max-height:min(90dvh,640px);overflow:auto}
.panel h2{margin:0 0 10px;font-size:20px;color:#1a2340}
.panel p{margin:0 0 10px;font-size:14px;line-height:1.45;color:#334155}
.panel ul{margin:0 0 16px;padding-left:18px;font-size:13px;line-height:1.45;color:#475569}
.panel button{border:0;border-radius:999px;background:#f5b400;color:#1a2340;font-weight:900;font-size:15px;padding:12px 22px;width:100%;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <a href="../menu/" id="menu">☰ Меню</a>
    <h1 id="title">Графік світла</h1>
    <button id="lang" type="button">UA</button>
  </header>
  <div id="diff" role="group" aria-label="difficulty">
    <button type="button" id="diffEasy" class="on">Проста</button>
    <button type="button" id="diffHard">Складна</button>
  </div>
  <div id="toolbar">
    <div class="stat" id="darkStat"><span id="darkLbl">темрява</span> <b id="darkCount">26</b></div>
    <div class="stat" id="flagStat"><span id="flagLbl">мітки</span> <b id="flagCount">0</b></div>
    <div class="actions">
      <button type="button" id="flagMode">🏷</button>
      <button type="button" id="rulesBtn">?</button>
      <button type="button" id="replay">↻</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="boardWrap">
    <div id="board" class="easy" role="grid" aria-label="schedule"></div>
  </div>
  <div id="legend"></div>
  <div id="result" aria-live="polite">
    <div id="resultMain">
      <div id="resultTxt"></div>
      <button type="button" id="resultReplay"></button>
    </div>
    <a class="zsu-donate zsu-light zsu-block" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
  </div>
  <div id="status"></div>
</div>
<div class="ov" id="overlay">
  <div class="panel">
    <h2 id="oTitle"></h2>
    <p id="oBody"></p>
    <ul id="oRules"></ul>
    <button type="button" id="oBtn"></button>
  </div>
</div>
<script src="../shared/zsu-donate.js"></script>
<script src="game.js"></script>
</body>
</html>
