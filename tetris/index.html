<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Тетріс відключень · One Day in Kyiv</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#e8ebf0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a2340}
#wrap{margin:0 auto;max-width:560px;height:100dvh;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;background:#f4f5f8;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
header a{color:#64748b;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
h1{margin:0;font-size:clamp(14px,3.8vw,17px);font-weight:800;color:#1a2340;text-align:center;flex:1;line-height:1.15}
#lang,#pauseBtn{border:0;border-radius:999px;background:#1a2340;color:#fff;font-weight:800;padding:7px 11px;font-size:12px;min-height:36px;min-width:40px;cursor:pointer}
#pauseBtn{background:#fff;color:#1a2340;border:1.5px solid #c9ced8}
#toolbar{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;flex:none;overflow:auto}
.stat{background:#fff;border:1px solid #d7dbe3;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:#1a2340;display:flex;align-items:center;gap:5px;min-height:36px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.stat.hi b{color:#1a2340;background:#ffe566;border-radius:6px;padding:1px 6px}
#hint{font-size:11px;color:#64748b;line-height:1.3;flex:none}
#play{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0}
#boardCard{background:#fff;border:1px solid #d0d5de;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px #0000000a;padding:0;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
#board{display:block;max-width:100%;max-height:100%;touch-action:none}
#meta{display:flex;gap:8px;align-items:stretch;flex:none}
#nextCard,#legendCard{background:#fff;border:1px solid #d0d5de;border-radius:10px;padding:6px 8px;box-shadow:0 1px 2px #0000000a}
#nextCard{flex:0 0 auto;min-width:72px;display:flex;flex-direction:column;align-items:center}
#legendCard{flex:1 1 auto;min-width:0}
#nextLbl,#legTitle{font-size:10px;font-weight:800;color:#1a2340;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
#next{display:block;width:56px;height:56px;background:#fff}
#legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:#475569;line-height:1.25}
#legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:2px;border:1px solid #c9ced8;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw.light{background:#fff}
.sw.dark{background:#9aa3b2}
.sw.dark svg{width:10px;height:10px}
.sw.half{width:18px;height:12px;border-radius:2px;overflow:hidden;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid #c9ced8}
.sw.half i{display:block;height:100%}
.sw.half i:first-child{background:#e8ebf0}
.sw.half i:last-child{background:#cbd2dc}
#pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;flex:none}
#pad button{border:0;border-radius:14px;background:#fff;color:#1a2340;border:1.5px solid #c9ced8;font-weight:900;font-size:18px;min-height:48px;cursor:pointer;box-shadow:0 1px 0 #0001}
#pad button:active{background:#eef1f6}
#pad .soft{font-size:15px;grid-column:1/2}
#pad .drop{grid-column:2/-1;background:#ffe566;border-color:#f5b400;font-size:14px}
#status{min-height:14px;font-size:12px;font-weight:700;text-align:center;color:#64748b;flex:none}
.ov{position:fixed;inset:0;background:#1a2340cc;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.hidden{display:none}
.panel{background:#fff;border-radius:16px;padding:20px 18px;max-width:360px;width:100%;box-shadow:0 12px 40px #0004}
.panel h2{margin:0 0 10px;font-size:20px;color:#1a2340}
.panel p{margin:0 0 16px;font-size:14px;line-height:1.45;color:#334155}
.panel button{border:0;border-radius:999px;background:#f5b400;color:#1a2340;font-weight:900;font-size:15px;padding:12px 22px;width:100%;cursor:pointer}
@media (min-width:700px){
  #wrap{max-width:640px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));gap:8px}
  #pad button{min-height:52px}
  #next{width:64px;height:64px}
}
@media (max-width:360px){
  .stat{padding:5px 7px;font-size:11px}
  #pad button{min-height:44px;font-size:16px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <a href="../menu/" id="menu">☰ Меню</a>
    <h1 id="title">Тетріс відключень</h1>
    <button id="lang" type="button">UA</button>
  </header>
  <div id="toolbar">
    <div class="stat hi" id="scoreStat"><span id="scoreLbl">рахунок</span> <b id="score">0</b></div>
    <div class="stat" id="linesStat"><span id="linesLbl">лінії</span> <b id="lines">0</b></div>
    <div class="stat" id="levelStat"><span id="levelLbl">рівень</span> <b id="level">1</b></div>
    <button type="button" id="pauseBtn" title="Pause">⏸</button>
  </div>
  <div id="hint"></div>
  <div id="play">
    <div id="boardCard"><canvas id="board" width="420" height="360" aria-label="tetris board"></canvas></div>
    <div id="meta">
      <div id="nextCard">
        <div id="nextLbl">Далі</div>
        <canvas id="next" width="56" height="56"></canvas>
      </div>
      <div id="legendCard">
        <div id="legTitle">Легенда</div>
        <div id="legend"></div>
      </div>
    </div>
  </div>
  <div id="status"></div>
  <div id="pad" aria-label="controls">
    <button type="button" id="btnLeft" aria-label="left">◀</button>
    <button type="button" id="btnRot" aria-label="rotate">↻</button>
    <button type="button" id="btnRight" aria-label="right">▶</button>
    <button type="button" id="btnSoft" class="soft" aria-label="soft drop">▼</button>
    <button type="button" id="btnHard" class="drop" aria-label="hard drop">▼▼ Hard</button>
  </div>
</div>
<div class="ov" id="overlay">
  <div class="panel">
    <h2 id="oTitle"></h2>
    <p id="oBody"></p>
    <button type="button" id="oBtn"></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
