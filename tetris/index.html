<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Тетріс відключень · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:#0d1118;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf5}
#wrap{margin:0 auto;max-width:560px;height:100dvh;max-height:100dvh;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:#121821;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
header a{color:#8b95a8;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;padding:6px 2px}
h1{margin:0;font-size:clamp(14px,3.8vw,17px);font-weight:800;color:#f2f5fa;text-align:center;flex:1;line-height:1.15}
#lang,#pauseBtn{border:0;border-radius:999px;background:#2a3344;color:#f2f5fa;font-weight:800;padding:7px 11px;font-size:12px;min-height:36px;min-width:40px;cursor:pointer;touch-action:manipulation}
#pauseBtn{background:#1a2230;border:1.5px solid #3a4558;width:100%;border-radius:12px;padding:8px 6px}
#play{display:flex;flex-direction:row;align-items:stretch;gap:8px;flex:1 1 0;min-height:0;min-width:0}
#boardCard{background:#0f141c;border:1px solid #2a3344;border-radius:10px;overflow:hidden;padding:0;display:flex;justify-content:center;align-items:flex-start;touch-action:none;flex:1 1 0;min-width:0;min-height:0}
#board{display:block;width:auto;height:auto;max-width:100%;max-height:100%;touch-action:none;vertical-align:top;-ms-touch-action:none}
#side{flex:0 0 78px;width:78px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;align-self:stretch}
.stat{background:#1a2230;border:1px solid #2e384a;border-radius:10px;padding:6px 7px;font-size:10px;font-weight:700;color:#c9d2e0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.15}
.stat b{font-variant-numeric:tabular-nums;font-size:15px;color:#f2f5fa;line-height:1.1}
.stat.hi b{color:#121821;background:#f5c518;border-radius:6px;padding:1px 5px}
#nextCard{background:#1a2230;border:1px solid #2e384a;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:auto}
#nextLbl{font-size:10px;font-weight:800;color:#c9d2e0;margin:0;text-transform:uppercase;letter-spacing:.02em}
#next{display:block;width:56px;height:56px;background:#0f141c;border-radius:6px}
.ov{position:fixed;inset:0;background:#0d1118cc;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:20}
.ov.hidden{display:none}
.panel{background:#1a2230;border:1px solid #2e384a;border-radius:16px;padding:18px 16px;max-width:360px;width:100%;max-height:100%;overflow:auto;box-shadow:0 12px 40px #0008}
.panel h2{margin:0 0 10px;font-size:20px;color:#f2f5fa}
.panel p{margin:0 0 14px;font-size:14px;line-height:1.45;color:#a7b1c2}
.panel button{border:0;border-radius:999px;background:#f5c518;color:#121821;font-weight:900;font-size:15px;padding:12px 22px;width:100%;cursor:pointer}
#startExtra.hidden{display:none}
#legTitle{font-size:11px;font-weight:800;color:#c9d2e0;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
#legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#a7b1c2;line-height:1.3;margin:0 0 12px}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend em{font-style:normal}
.sw{width:14px;height:14px;border-radius:2px;border:1px solid #3a4558;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw.empty{background:#0f141c}
.sw.settled{background:#6b7380}
.sw.settled svg{width:10px;height:10px}
.sw.active{background:#0f141c}
.sw.active svg{width:10px;height:10px}
#hint{margin:0 0 14px;font-size:12px;line-height:1.4;color:#8b95a8}
@media (min-width:700px){
  #wrap{max-width:640px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
  #side{flex-basis:96px;width:96px}
  #next{width:64px;height:64px}
  .stat{font-size:11px}
  .stat b{font-size:16px}
}
@media (max-width:360px){
  #side{flex-basis:70px;width:70px}
  #next{width:48px;height:48px}
  .stat{padding:5px 6px}
  .stat b{font-size:14px}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <a href="../menu/" id="menu">☰ Меню</a>
    <h1 id="title">Тетріс відключень</h1>
    <button id="lang" type="button">UA</button>
  </header>
  <div id="play">
    <div id="boardCard"><canvas id="board" width="360" height="720" aria-label="tetris board"></canvas></div>
    <aside id="side" aria-label="stats">
      <button type="button" id="pauseBtn" title="Pause">⏸</button>
      <div class="stat hi" id="scoreStat"><span id="scoreLbl">рахунок</span> <b id="score">0</b></div>
      <div class="stat" id="linesStat"><span id="linesLbl">лінії</span> <b id="lines">0</b></div>
      <div class="stat" id="levelStat"><span id="levelLbl">рівень</span> <b id="level">1</b></div>
      <div id="nextCard">
        <div id="nextLbl">Далі</div>
        <canvas id="next" width="56" height="56"></canvas>
      </div>
    </aside>
  </div>
</div>
<div class="ov" id="overlay">
  <div class="panel">
    <h2 id="oTitle"></h2>
    <p id="oBody"></p>
    <div id="startExtra">
      <div id="legTitle"></div>
      <div id="legend"></div>
      <p id="hint"></p>
    </div>
    <a class="zsu-donate zsu-block" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
    <button type="button" id="oBtn"></button>
  </div>
</div>
<script src="../shared/zsu-donate.js"></script>
<script src="game.js"></script>
</body>
</html>
