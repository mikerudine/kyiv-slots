<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Київський однорукий бандит</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111827;color:#f9fafb;font-family:system-ui,sans-serif;text-align:center}
h1{font-size:1.6rem;margin:0 0 .3rem}.sub{color:#9ca3af;margin-bottom:1.5rem}
.machine{background:linear-gradient(#b91c1c,#7f1d1d);padding:24px;border-radius:24px;box-shadow:0 10px 40px #000a}
.reels{display:flex;gap:12px}
.reel{width:110px;height:130px;background:#fff;color:#111;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3.4rem;box-shadow:inset 0 4px 10px #0005}
.reel small{font-size:.7rem;margin-top:4px;color:#374151}
.reel.spin{animation:sh .1s infinite}@keyframes sh{50%{transform:translateY(4px)}}
button{margin-top:20px;font-size:1.3rem;padding:14px 40px;border:0;border-radius:999px;background:#facc15;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}#msg{min-height:2.5em;margin-top:18px;font-size:1.15rem;max-width:380px}#score{color:#9ca3af;margin-top:6px}
#msg.win{font-size:clamp(2.2rem,8vw,4.5rem);font-weight:900;line-height:1.05;max-width:95vw;color:#fde047;text-transform:uppercase;text-shadow:0 0 12px #f59e0b,0 0 30px #ef4444,4px 4px 0 #b91c1c;animation:win .5s ease-in-out infinite alternate}
@keyframes win{from{transform:scale(1) rotate(-2deg);color:#fde047}to{transform:scale(1.12) rotate(2deg);color:#fff}}
#msg.super{animation:win .25s ease-in-out infinite alternate}
.sup{font-size:1.3em;color:#f0f;text-shadow:0 0 15px #f0f,0 0 40px #0ff,5px 5px 0 #000}
body:has(#msg.super){animation:bg .3s infinite alternate}@keyframes bg{from{background:#111827}to{background:#4c1d95}}
</style></head><body>
<h1>🎰 Київський однорукий бандит</h1><div class="sub">Що сьогодні випаде?</div>
<div class="machine"><div class="reels"><div class="reel" id="r0">❓</div><div class="reel" id="r1">❓</div><div class="reel" id="r2">❓</div></div></div>
<button id="b">Крутити!</button><div id="msg"></div><div id="score"></div>
<nav style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
  <a href="menu/" style="color:#0b1020;text-decoration:none;background:#fde047;padding:10px 16px;border-radius:999px;font-weight:800">📋 Меню</a>
  <a href="dogwalk/" style="color:#fde047;text-decoration:none;background:#1e293b;padding:10px 16px;border-radius:999px;font-weight:700">🐕 Прогулянка</a>
  <a href="scooter/" style="color:#fde047;text-decoration:none;background:#1e293b;padding:10px 16px;border-radius:999px;font-weight:700">🛴 Самокат</a>
  <a href="laundry/" style="color:#fde047;text-decoration:none;background:#1e293b;padding:10px 16px;border-radius:999px;font-weight:700">🫧 Стирка</a>
  <a href="dice/" style="color:#fde047;text-decoration:none;background:#1e293b;padding:10px 16px;border-radius:999px;font-weight:700">🎲 Кості світла</a>
</nav>
<script>
const S=[{e:"🚨",n:"Тривога"},{e:"💡",n:"Світла нема"},{e:"🌧️",n:"Дощ"}];
const J=["🚨 ХОВАЙСЯ В ЖИТО 🚨","🕯️ ТЕМНО ЯК У ДУПІ 🕯️","🌧️ ЛЬЄ ЯК З ВІДРА 🌧️"];
let spins=0,jp=0;const b=document.getElementById('b'),m=document.getElementById('msg');
function show(i,s){const r=document.getElementById('r'+i);r.innerHTML=s.e+'<small>'+s.n+'</small>'}
b.onclick=()=>{b.disabled=true;m.textContent='';m.className='';const res=[0,1,2].map(()=>Math.floor(Math.random()*3));
[0,1,2].forEach(i=>{const r=document.getElementById('r'+i);r.classList.add('spin');
const t=setInterval(()=>show(i,S[Math.floor(Math.random()*3)]),80);
setTimeout(()=>{clearInterval(t);r.classList.remove('spin');show(i,S[res[i]]);
if(i==2){spins++;const u=[...new Set(res)];m.className='win';
let h=u.map(k=>'<div>'+J[k]+'</div>').join('');
if(u.length==3){jp++;m.className='win super';h='<div class="sup">💥 СУПЕРВИГРАШ 💥</div>'+h}
m.innerHTML=h;
document.getElementById('score').textContent=`Спроб: ${spins} · Супервиграшів: ${jp}`;b.disabled=false}},900+i*500)})}
</script></body></html>
