<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Стирка · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c1220;color:#f1f5f9;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#wrap{
  position:relative;
  width:min(100vw,480px);
  height:100dvh;
  max-height:100dvh;
  margin:0 auto;
  /* Left/right/bottom only — top inset is applied on nav + HUD so absolute
     children (positioned against the padding edge) clear the notch together. */
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:linear-gradient(165deg,#152238 0%,#0c1220 55%,#101828 100%);
  flex:0 0 auto;
  overflow:hidden;
  box-sizing:border-box;
}
canvas#game{display:block;width:100%;height:100%;background:transparent}

/* Nav is ABSOLUTE inside wrap (same box as HUD) — not viewport-fixed —
   so Safari and WKWebView share one safe-area top inset. */
#nav{
  position:absolute;
  top:calc(6px + env(safe-area-inset-top,0px));
  left:6px;right:6px;
  z-index:50;pointer-events:auto;
  display:flex;flex-wrap:nowrap;gap:5px;align-items:center;overflow:hidden;
}
#nav a{color:#e2e8f0;font-size:11px;text-decoration:none;background:#0f172add;padding:6px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
#nav a.menu{background:#facc15;color:#111;font-weight:800}
@media (max-width:360px){
  #nav a:not(.menu){display:none}
}

/* HUD sits below the nav row; top padding includes the same safe-area inset. */
#hud{
  position:absolute;inset:0;pointer-events:none;
  display:flex;flex-direction:column;
  padding:calc(42px + env(safe-area-inset-top,0px)) 8px 0;
  z-index:3;
}
#hudChrome{
  display:flex;flex-direction:column;gap:4px;
  padding:2px 0 8px;
  background:linear-gradient(180deg,#0c1220f5 70%,#0c122000);
}
#hud .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:28px}
#hud .title{font-weight:800;font-size:14px;letter-spacing:.02em;text-shadow:0 1px 2px #0008;white-space:nowrap}
#hud .hint{display:none}
#hud .meta{display:flex;align-items:center;gap:6px;font-size:11px;text-shadow:0 1px 2px #0008;flex-wrap:nowrap}
#hud .btns{display:flex;gap:4px}
#hud .stats{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#lang,#pauseBtn{pointer-events:auto;border:0;border-radius:999px;background:#1e293bcc;color:#fff;font-weight:800;padding:5px 9px;font-size:11px}
#pauseBtn{min-width:30px;padding:5px 8px}
#pauseBtn.hidden{display:none}

/* Prominent timer — large seconds + static bar (no blink). */
#timerBlock{display:none;align-items:center;gap:10px;padding:2px 2px 0}
#timerBlock.show{display:flex}
#timerBig{
  font-weight:900;font-size:28px;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:center;
  text-shadow:0 1px 2px #000a;color:#f8fafc;
}
#timerBig.warn{color:#fbbf24}
#timerBig.danger{color:#fb7185}
#timerTrack{
  flex:1;height:8px;border-radius:999px;background:#1e293b;
  border:1px solid #334155;overflow:hidden;
}
#timerFill{
  height:100%;width:100%;border-radius:999px;background:#38bdf8;
  transform-origin:left center;transform:scaleX(1);
  /* no transition — fill is set from JS each tick; avoids flash */
}
#timerFill.warn{background:#fbbf24}
#timerFill.danger{background:#fb7185}

#overlay,#pauseOverlay,#washOverlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  text-align:center;
}
#overlay{background:#0c1220f2}
#overlay.hidden{display:none}
#pauseOverlay{display:none;background:#0c1220f0;z-index:7;pointer-events:auto}
#pauseOverlay.show{display:flex}
#washOverlay{display:none;background:#0c1220cc;z-index:5;pointer-events:none}
#washOverlay.show{display:flex}
#washOverlay .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:18px 22px;max-width:260px}
#washOverlay .washer{width:56px;height:56px;margin:0 auto 10px;border-radius:12px;background:#334155;border:2px solid #94a3b8;position:relative}
#washOverlay .washer::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid #64748b;background:#0f172a}
#washOverlay p{margin:0;font-weight:700}
#overlay h1,#pauseOverlay h1{margin:0 0 8px;font-size:1.45rem}
#pauseOverlay h1{font-size:2rem;font-weight:900}
#overlay p,#pauseOverlay p{margin:0 0 14px;opacity:.88;line-height:1.45;max-width:320px}
#overlay .stats{font-size:13px;opacity:.9;margin:0 0 16px;line-height:1.5}
#overlay button{pointer-events:auto;border:0;border-radius:999px;background:#facc15;color:#111;font-weight:800;font-size:1.05rem;padding:12px 28px}
@media (prefers-reduced-motion:reduce){
  #washOverlay .washer::after{transition:none}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="nav"><a class="menu" href="../menu/">☰ Меню</a><a href="../">Слоти</a><a href="../dogwalk/">Прогулянка</a><a href="../scooter/">Самокат</a></div>
  <div id="hud">
    <div id="hudChrome">
      <div class="top">
        <div class="title" id="tTitle">Стирка</div>
        <div class="hint" id="hint"></div>
        <div class="meta">
          <div class="stats">
            <span id="roundLine"></span>
            <span id="scoreLine"></span>
          </div>
          <div class="btns">
            <button type="button" id="pauseBtn" class="hidden" title="Pause">⏸</button>
            <button type="button" id="lang">UA</button>
          </div>
        </div>
      </div>
      <div id="timerBlock" aria-live="polite">
        <div id="timerBig">60</div>
        <div id="timerTrack"><div id="timerFill"></div></div>
      </div>
    </div>
  </div>
  <div id="washOverlay" aria-hidden="true">
    <div class="card">
      <div class="washer" aria-hidden="true"></div>
      <p id="washText">Прання…</p>
    </div>
  </div>
  <div id="overlay">
    <div>
      <h1 id="oTitle">Стирка</h1>
      <p id="oBody"></p>
      <div class="stats" id="oStats" hidden></div>
      <a class="zsu-donate" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
      <button type="button" id="oBtn">Старт</button>
    </div>
  </div>
  <div id="pauseOverlay">
    <div>
      <h1 id="pauseTitle">Пауза</h1>
      <p id="pauseBody">Торкніться, щоб продовжити</p>
    </div>
  </div>
</div>
<script src="../shared/zsu-donate.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
