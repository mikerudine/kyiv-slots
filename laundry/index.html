<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Стирка · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#02040c;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc(100dvh*9/16),480px);height:min(100dvh,calc(100vw*16/9));aspect-ratio:9/16;margin:0 auto;background:#010208;flex:0 0 auto}
canvas#game{display:block;width:100%;height:100%;background:#05040a}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:3}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud .title{font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
#hud .meta{text-align:right;font-size:12px;opacity:.9;text-shadow:0 1px 2px #000}
#hud .btns{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}
#lang,#pauseBtn{pointer-events:auto;border:0;border-radius:999px;background:#1e293bcc;color:#fff;font-weight:800;padding:6px 12px;font-size:12px}
#pauseBtn{min-width:36px;padding:6px 10px}
#pauseBtn.hidden{display:none}
#hint{font-size:12px;opacity:.75;max-width:72%;text-shadow:0 1px 2px #000;line-height:1.25}
#overlay,#pauseOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;padding:24px;text-align:center}
#overlay{background:#010208e6}
#overlay.hidden{display:none}
#pauseOverlay{display:none;background:#020617e8;z-index:7;pointer-events:auto}
#pauseOverlay.show{display:flex}
#overlay h1,#pauseOverlay h1{margin:0 0 8px;font-size:1.45rem}
#pauseOverlay h1{font-size:2rem;font-weight:900}
#overlay p,#pauseOverlay p{margin:0 0 16px;opacity:.85;line-height:1.4;max-width:320px}
#overlay button{pointer-events:auto;border:0;border-radius:999px;background:#facc15;color:#111;font-weight:800;font-size:1.05rem;padding:12px 28px}
#nav{position:absolute;top:48px;left:12px;z-index:4;pointer-events:auto}
#nav a{color:#94a3b8;font-size:11px;text-decoration:none;background:#0f172acc;padding:3px 8px;border-radius:999px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="nav"><a href="../menu/">☰ Меню</a> · <a href="../">Слоти</a> · <a href="../dogwalk/">Прогулянка</a> · <a href="../scooter/">Самокат</a></div>
  <div id="hud">
    <div class="row">
      <div>
        <div class="title" id="tTitle">Стирка</div>
        <div id="hint"></div>
      </div>
      <div class="meta">
        <div class="btns">
          <button type="button" id="pauseBtn" class="hidden" title="Pause">⏸</button>
          <button type="button" id="lang">UA</button>
        </div>
        <div id="scoreLine"></div>
        <div id="movesLine"></div>
        <div id="fps">— fps</div>
      </div>
    </div>
    <div></div>
  </div>
  <div id="overlay">
    <div>
      <h1 id="oTitle">Стирка</h1>
      <p id="oBody"></p>
      <button type="button" id="oBtn">Старт</button>
    </div>
  </div>
  <div id="pauseOverlay">
    <div>
      <h1 id="pauseTitle">Пауза</h1>
      <p id="pauseBody">Торкніться, щоб продовжити</p>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
