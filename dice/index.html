<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Кості світла · One Day in Kyiv</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9ecf1;font-family:system-ui,-apple-system,sans-serif;color:#1c2742}
#wrap{position:relative;margin:0 auto;width:min(100vw,calc(100dvh*9/16),480px);height:100dvh;background:#f2f3f6;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px));overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header a{color:#64748b;text-decoration:none;font-size:13px;padding:4px 2px}
h1{font-size:18px;margin:0;font-weight:800}
#lang{border:0;border-radius:999px;background:#1c2742;color:#fff;font-weight:800;padding:6px 12px;font-size:12px}
.card{background:#fff;border-radius:16px;padding:10px 12px;margin-top:8px;box-shadow:0 1px 3px #0001}
#guessRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#guessRow label{font-size:13px;flex:1 1 100%}
#guess{flex:1;accent-color:#f5b400}
#guessVal{font-size:22px;font-weight:900;min-width:44px;text-align:center}
#dice{display:flex;justify-content:center;gap:22px;align-items:center;height:76px}
.die{width:62px;height:62px;border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;transition:transform .5s ease}
.die.white{background:#fff;border:2px solid #cbd2dc}
.die.black{background:#1c2742;border:2px solid #1c2742}
.die i{width:10px;height:10px;border-radius:50%;place-self:center;visibility:hidden}
.die.white i{background:#1c2742}.die.black i{background:#fff!important}
.die i.on{visibility:visible}
.die.roll{animation:wob .55s ease-in-out}
.die.shake{animation:shk .28s ease-in-out infinite}
@keyframes shk{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-5deg) scale(1.03)}75%{transform:translate(2px,-1px) rotate(5deg) scale(.98)}}
#btn,#dice{touch-action:none;cursor:pointer}
@keyframes wob{0%{transform:translateY(-14px) rotate(-30deg)}40%{transform:translateY(0) rotate(160deg)}70%{transform:translateY(-4px) rotate(350deg)}100%{transform:rotate(0)}}
#rollInfo{text-align:center;font-size:13px;color:#475569;min-height:18px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{height:clamp(30px,5.2dvh,44px);border-radius:10px;border:1.5px solid #dfe3ea;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#1c2742;transition:background .35s ease,color .35s ease}
.cell .ic{margin-right:4px;font-size:12px;opacity:0}
.cell.light .ic{opacity:1;color:#f5b400}
.cell.dark{background:#1c2742;border-color:#1c2742;color:#fff}
.cell.dark .ic{opacity:1}
.cell.empty{color:#b6bdc8}
#legend{display:flex;gap:14px;font-size:12px;margin-top:8px;flex-wrap:wrap}
#legend span{display:flex;align-items:center;gap:6px}
#legend b{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid #cbd2dc}
#result{display:none;flex:1 1 0;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2dvh,12px);margin:6px 0 8px;padding:clamp(8px,1.8dvh,18px) 12px;border-radius:16px;border:2px solid transparent;text-align:center;overflow:hidden}
#result.show{display:flex}
#result.win{border-color:#86efac;background:#ecfdf5;color:#14532d}
#result.lose{border-color:#fca5a5;background:#fef2f2;color:#7f1d1d}
#result.enter{animation:result-in .4s ease-out}
@keyframes result-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #result.enter{animation:none}
  .die.roll,.die.shake{animation:none}
  .cell{transition:none}
}
#resultIcon{width:clamp(28px,5.5dvh,48px);height:clamp(28px,5.5dvh,48px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3.8dvh,28px);font-weight:900;line-height:1;flex-shrink:0}
#result.win #resultIcon{background:#16a34a;color:#fff}
#result.lose #resultIcon{background:#dc2626;color:#fff}
#resultTitle{margin:0;font-size:clamp(20px,4.8dvh,32px);font-weight:900;line-height:1.15;letter-spacing:-0.02em}
#resultNums{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.8vw,16px);width:100%;max-width:360px;flex-shrink:0}
.result-stat{flex:1 1 110px;min-width:0;padding:clamp(6px,1.2dvh,12px) 8px;border-radius:12px;background:#fff;border:1px solid #e2e8f0}
#result.win .result-stat{border-color:#bbf7d0}
#result.lose .result-stat{border-color:#fecaca}
.result-stat .lbl{display:block;font-size:clamp(11px,2.8vw,13px);font-weight:700;opacity:.75;margin-bottom:2px}
.result-stat .val{display:block;font-size:clamp(20px,4.4dvh,30px);font-weight:900;line-height:1.1;color:#1c2742}
#resultDiff{font-size:clamp(12px,2.8vw,16px);font-weight:800;line-height:1.3;flex-shrink:0}
#result.win #resultDiff{color:#15803d}
#result.lose #resultDiff{color:#b91c1c}
#wrap.done #guessRow,#wrap.done #diceCard{display:none}
/* Shrink schedule grid on result so the card + ZSU banner fit short/safe-area viewports */
#wrap.done .card:has(#grid){flex:0 1 auto;min-height:0;margin-top:6px;padding:8px 10px}
#wrap.done #grid{gap:4px}
#wrap.done .cell{height:clamp(22px,3.6dvh,36px);font-size:11px;border-radius:8px}
#wrap.done #legend{margin-top:4px;font-size:11px;gap:10px}
#wrap.done #result{flex:1 1 auto;min-height:0}
#btn{margin-top:auto;flex-shrink:0;border:0;border-radius:999px;background:#f5b400;color:#1c2742;font-weight:900;font-size:17px;padding:14px;width:100%}
#btn:disabled{opacity:.5}
a.zsu-donate.zsu-block{flex-shrink:0}
</style>
</head>
<body>
<div id="wrap">
  <header><a href="../menu/">☰ Меню</a><h1 id="title">Кості світла</h1><button id="lang" type="button">UA</button></header>
  <div class="card" id="guessRow">
    <label id="guessLbl" for="guess"></label>
    <input id="guess" type="range" min="1" max="24" value="12"><span id="guessVal">12</span>
  </div>
  <div class="card" id="diceCard">
    <div id="dice"><div class="die white" id="dw"></div><div class="die black" id="db"></div></div>
    <div id="rollInfo"></div>
  </div>
  <div class="card">
    <div id="grid"></div>
    <div id="legend"><span><b style="background:#fff"></b><em id="lgL"></em></span><span><b style="background:#1c2742;border-color:#1c2742"></b><em id="lgD"></em></span></div>
  </div>
  <div id="result" aria-live="polite">
    <div id="resultIcon" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <div id="resultNums">
      <div class="result-stat"><span class="lbl" id="resultLightLbl"></span><span class="val" id="resultLightVal"></span></div>
      <div class="result-stat"><span class="lbl" id="resultGuessLbl"></span><span class="val" id="resultGuessVal"></span></div>
    </div>
    <div id="resultDiff"></div>
  </div>
  <a class="zsu-donate zsu-light zsu-block" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
  <button id="btn" type="button"></button>
</div>
<script src="../shared/zsu-donate.js"></script>
<script src="game.js"></script>
</body>
</html>
