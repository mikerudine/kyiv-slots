<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Прогулянка з собакою · 3-lane</title>
<script data-goatcounter="https://mikerudine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="../shared/zsu-donate.css">
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#02040c;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:#010208}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#05040a}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:3}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud .title{font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
#hud .meta{text-align:right;font-size:12px;opacity:.9;text-shadow:0 1px 2px #000}
#hud .btns{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}
#lang,#pauseBtn{pointer-events:auto;border:0;border-radius:999px;background:#1e293bcc;color:#fff;font-weight:800;padding:6px 12px;font-size:12px}
#pauseBtn{min-width:36px;padding:6px 10px}
#pauseBtn.hidden{display:none}
#hint{font-size:12px;opacity:.75;max-width:70%;text-shadow:0 1px 2px #000}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#010208e6;z-index:6;padding:24px;text-align:center}
#overlay.hidden{display:none}
#overlay h1{margin:0 0 8px;font-size:1.4rem}
#overlay p{margin:0 0 16px;opacity:.85;line-height:1.4}
#overlay button{pointer-events:auto;border:0;border-radius:999px;background:#facc15;color:#111;font-weight:800;font-size:1.05rem;padding:12px 28px}
#pauseOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020617e8;z-index:7;padding:24px;text-align:center;pointer-events:auto}
#pauseOverlay.show{display:flex}
#pauseOverlay h1{margin:0 0 8px;font-size:2rem;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px #000}
#pauseOverlay p{margin:0;opacity:.8;font-size:14px}
#notifs{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
/* Telegram-style push cards: white body, dark text, severity accent bar only (no flash/pulse) */
.notif{
  pointer-events:auto;position:absolute;width:min(92%,340px);
  background:#fff;color:#1c1c1e;
  border:1px solid rgba(0,0,0,.06);border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08);
  padding:10px 12px 10px 14px;display:flex;gap:10px;align-items:flex-start;
  opacity:0;transform:translateX(28px);transition:transform .2s ease-out,opacity .2s ease-out;
  touch-action:none;overflow:hidden;
}
.notif::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#cbd5e1;
}
.notif.level-yellow::before{background:#eab308}
.notif.level-red::before{background:#dc2626}
.notif.level-green::before{background:#16a34a}
.notif.show{opacity:1;transform:translateX(0)}
.notif.swiping{transition:none}
.notif .avatar{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  background:#2aabee;color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}
.notif.level-yellow .avatar{background:#ca8a04}
.notif.level-red .avatar{background:#dc2626}
.notif.level-green .avatar{background:#16a34a}
.notif .body{flex:1;min-width:0}
.notif .app{font-size:12px;color:#111827;font-weight:700;letter-spacing:.01em;line-height:1.2}
.notif .msg{font-size:13px;line-height:1.3;margin-top:2px;color:#374151}
.notif .swipe{font-size:10px;color:#9ca3af;margin-top:4px}
.notif .badge{
  flex:0 0 auto;align-self:flex-start;margin-top:2px;
  font-size:10px;font-weight:800;line-height:1;padding:4px 6px;border-radius:6px;
  background:#f3f4f6;color:#6b7280;
}
.notif.level-yellow .badge{background:#fef9c3;color:#854d0e}
.notif.level-red .badge{background:#fee2e2;color:#991b1b}
.notif.level-green .badge{background:#dcfce7;color:#166534}
/* Individual lens splats — same swipe mechanic as alerts */
.lens-splat{pointer-events:auto;position:absolute;width:78px;height:78px;border-radius:50%;transform:translateX(0) scale(1);transition:transform .16s ease-out,opacity .16s;touch-action:none;z-index:5}
.lens-splat.swiping{transition:none}
.lens-splat.rain{
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.55) 0 8%, transparent 18%),
    radial-gradient(circle at 50% 55%, rgba(186,230,253,.55) 0 28%, rgba(56,189,248,.18) 45%, transparent 70%);
  box-shadow:0 0 0 1px rgba(186,230,253,.25), 0 8px 18px #0006;
  backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);
}
.lens-splat.snow{
  background:
    radial-gradient(circle at 40% 35%, rgba(255,255,255,.9) 0 14%, transparent 22%),
    radial-gradient(circle at 50% 50%, rgba(241,245,249,.75) 0 34%, rgba(148,163,184,.2) 55%, transparent 72%);
  box-shadow:0 0 0 1px rgba(226,232,240,.35), 0 6px 14px #0005;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.lens-splat .cap{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:9px;font-weight:800;color:#e2e8f0;text-shadow:0 1px 2px #000;white-space:nowrap;opacity:.85;pointer-events:none}
</style>
</head>
<body>
<a href="../menu/" style="position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:50;font:600 12px system-ui;color:#cbd5e1;background:#0b1020aa;padding:5px 9px;border-radius:999px;text-decoration:none">☰ Меню</a>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="notifs"></div>
  <div id="hud">
    <div class="row">
      <div>
        <div class="title" id="tTitle">Прогулянка з собакою</div>
        <div id="hint"></div>
      </div>
      <div class="meta">
        <div class="btns">
          <button type="button" id="pauseBtn" class="hidden" title="Pause">⏸</button>
          <button type="button" id="lang">UA</button>
        </div>
        <div id="scoreLine"></div>
        <div id="livesLine"></div>
        <div id="fps">— fps</div>
      </div>
    </div>
  </div>
  <div id="overlay">
    <div>
      <h1 id="oTitle">Прогулянка</h1>
      <p id="oBody"></p>
      <a class="zsu-donate" data-zsu-donate hidden href="https://www.sternenkofund.org/donate" target="_blank" rel="noopener noreferrer">Підтримати ЗСУ</a>
      <button type="button" id="oBtn">Старт</button>
    </div>
  </div>
  <div id="pauseOverlay">
    <div>
      <h1 id="pauseTitle">Пауза</h1>
      <p id="pauseBody">Торкніться, щоб продовжити</p>
    </div>
  </div>
</div>
<script src="../shared/zsu-donate.js"></script>
<script src="runner.js"></script>
</body>
</html>
